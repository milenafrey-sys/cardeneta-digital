<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Tutores</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
            color: #111827;
        }
        form {
            display: grid;
            gap: 16px;
        }
        .campo {
            display: grid;
            gap: 8px;
        }
        label {
            font-weight: 600;
        }
        input, button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 16px;
        }
        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #60a5fa;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }
        button:hover {
            background: #1d4ed8;
        }
        .mensagem {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
        }
        .mensagem.sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
        }
        .mensagem.erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Tutor</h1>

        <form id="formTutor">
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" placeholder="Digite o nome do tutor" required />
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="text" placeholder="(00) 00000-0000" required />
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="email@exemplo.com" required />
            </div>

            <button type="submit">Salvar tutor</button>
        </form>

        <div id="mensagem" class="mensagem"></div>
    </div>

    <script>
        const form = document.getElementById('formTutor');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const tutor = {
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                email: document.getElementById('email').value
            };

            try {
                const response = await fetch('http://localhost:5050/api/caderneta/tutores', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(tutor)
                });

                const text = await response.text();

                if (!response.ok) {
                    throw new Error(text || 'Erro ao cadastrar tutor.');
                }

                mensagem.className = 'mensagem sucesso';
                mensagem.textContent = 'Tutor cadastrado com sucesso!';
                form.reset();
            } catch (error) {
                mensagem.className = 'mensagem erro';
                mensagem.textContent = error.message;
            }
        });
    </script>
</body>
</html>
